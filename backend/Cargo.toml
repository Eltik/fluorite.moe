[package]
name = "backend"
version = "0.1.0"
edition = "2024"

# ── Unified CLI ──────────────────────────────────────────

[[bin]]
name = "endfield"
path = "src/bin/endfield.rs"

# ── Standalone RE probes ─────────────────────────────────

[[bin]]
name = "auth-test"
path = "src/bin/auth_test.rs"

[[bin]]
name = "resource-test"
path = "src/bin/resource_test.rs"

[[bin]]
name = "gameassembly-extract"
path = "src/bin/gameassembly_extract.rs"

[[bin]]
name = "smiley-decrypt-test"
path = "src/bin/smiley_decrypt_test.rs"

[[bin]]
name = "char-data-probe"
path = "src/bin/char_data_probe.rs"

[[bin]]
name = "stat-engine"
path = "src/bin/stat_engine.rs"

[[bin]]
name = "vfs-decrypt-probe"
path = "src/bin/vfs_decrypt_probe.rs"

[[bin]]
name = "vfs-reconstruct"
path = "src/bin/vfs_reconstruct.rs"

[[bin]]
name = "memdump-analyze"
path = "src/bin/memdump_analyze.rs"

[[bin]]
name = "cdn-probe"
path = "src/bin/cdn_probe.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4", features = ["derive"] }
comfy-table = "7.2.2"
chrono = "0.4.43"
regex = "1.12.3"
url = "2.5.8"
indexmap = "2.13.0"
semver = "1.0.27"
futures = "0.3.32"
flate2 = "1.1.9"
lz4_flex = "0.12.0"
base64 = "0.22.1"
unity-asset = "0.2.0"
unity-asset-binary = "0.2.0"
unity-asset-core = "0.2.0"
aes = "0.8"
goblin = "0.8"
iced-x86 = { version = "1.21", features = ["decoder", "intel"] }
texture2ddecoder = "0.1"
image = "0.25"
