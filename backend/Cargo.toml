[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "auth-test"
path = "src/bin/auth_test.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
comfy-table = "7.2.2"
chrono = "0.4.43"
