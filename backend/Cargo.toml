[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "auth-test"
path = "src/bin/auth_test.rs"

[[bin]]
name = "resource-test"
path = "src/bin/resource_test.rs"

[[bin]]
name = "endfield-config-test"
path = "src/bin/endfield_config_test.rs"

[[bin]]
name = "zip-range-test"
path = "src/bin/zip_range_test.rs"

[[bin]]
name = "fairguard-test"
path = "src/bin/fairguard_test.rs"

[[bin]]
name = "vfs-test"
path = "src/bin/vfs_test.rs"

[[bin]]
name = "gameassembly-extract"
path = "src/bin/gameassembly_extract.rs"

[[bin]]
name = "magic-search"
path = "src/bin/magic_search.rs"

[[bin]]
name = "smiley-decrypt-test"
path = "src/bin/smiley_decrypt_test.rs"

[[bin]]
name = "index-test"
path = "src/bin/index_test.rs"

[[bin]]
name = "scan-assets"
path = "src/bin/scan_assets.rs"

[[bin]]
name = "extract-json"
path = "src/bin/extract_json.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
comfy-table = "7.2.2"
chrono = "0.4.43"
regex = "1.12.3"
url = "2.5.8"
indexmap = "2.13.0"
semver = "1.0.27"
futures = "0.3.32"
flate2 = "1.1.9"
lz4_flex = "0.12.0"
base64 = "0.22.1"
unity-asset = "0.2.0"
unity-asset-binary = "0.2.0"
