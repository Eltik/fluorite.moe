[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
comfy-table = "7.2.2"
chrono = "0.4.43"
regex = "1.12.3"
url = "2.5.8"
indexmap = "2.13.0"
semver = "1.0.27"
futures = "0.3.32"
flate2 = "1.1.9"
lz4_flex = "0.12.0"
base64 = "0.22.1"
unity-asset = "0.2.0"
unity-asset-binary = "0.2.0"
unity-asset-core = "0.2.0"
aes = "0.8"
goblin = "0.8"
iced-x86 = { version = "1.21", features = ["decoder", "intel"] }
texture2ddecoder = "0.1"
image = "0.25"

[patch.crates-io]
unity-asset-binary = { path = "unity-asset-binary-local" }
unity-asset = { path = "unity-asset-local" }
