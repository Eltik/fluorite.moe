[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "auth-test"
path = "src/bin/auth_test.rs"

[[bin]]
name = "resource-test"
path = "src/bin/resource_test.rs"

[[bin]]
name = "endfield-config-test"
path = "src/bin/endfield_config_test.rs"

[[bin]]
name = "zip-range-test"
path = "src/bin/zip_range_test.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
comfy-table = "7.2.2"
chrono = "0.4.43"
regex = "1.12.3"
url = "2.5.8"
indexmap = "2.13.0"
semver = "1.0.27"
futures = "0.3.32"
flate2 = "1.1.9"
