[package]
name = "backend"
version = "0.1.0"
edition = "2024"

# ── Unified CLI ──────────────────────────────────────────

[[bin]]
name = "endfield"
path = "src/bin/endfield.rs"

# ── Standalone utilities ─────────────────────────────────

[[bin]]
name = "auth-test"
path = "src/bin/auth_test.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time"] }
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4", features = ["derive"] }
comfy-table = "7.2.2"
chrono = "0.4.43"
regex = "1.12.3"
url = "2.5.8"
indexmap = "2.13.0"
semver = "1.0.27"
futures = "0.3.32"
flate2 = "1.1.9"
lz4_flex = "0.12.0"
unity-asset-binary = "0.2.0"
unity-asset-core = "0.2.0"
aes = "0.8"
texture2ddecoder = "0.1"
image = "0.25"

# Vendored with a relaxed array-size cap; see vendor/unity-asset-binary/VENDORED.md.
[patch.crates-io]
unity-asset-binary = { path = "vendor/unity-asset-binary" }
