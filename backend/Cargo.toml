[package]
name = "backend"
version = "0.1.0"
edition = "2024"
# Compiles the vendored ACL animation decompressor
build = "vendor/acl/build.rs"

[[bin]]
name = "endfield"
path = "src/bin/endfield.rs"

[[bin]]
name = "auth-test"
path = "src/bin/auth_test.rs"

[[bin]]
name = "fluorite-api"
path = "src/bin/fluorite-api.rs"

[dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "time", "net", "signal", "sync", "io-util", "process"] }
reqwest = { version = "0.13.2", features = ["json", "query", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
clap = { version = "4", features = ["derive"] }
comfy-table = "7.2.2"
chrono = "0.4.43"
regex = "1.12.3"
url = "2.5.8"
indexmap = "2.13.0"
semver = "1.0.27"
futures = "0.3.32"
flate2 = "1.1.9"
lz4_flex = "0.12.0"
unity-asset-core = "0.2.0"
aes = "0.8"
texture2ddecoder = "0.1"
image = "0.25"
base64 = "0.22"
axum = "0.8"
tower-http = { version = "0.6", features = ["cors", "compression-gzip", "compression-br", "trace", "set-header"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
httpdate = "1"
sha2 = "0.10"
hmac = "0.12"
dotenvy = { version = "0.15.7", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[features]
# Animation export in `endfield-models` (C++ shim over vendor/acl; needs a C++17 compiler).
acl = ["dep:cc"]

[build-dependencies]
cc = { version = "1", optional = true }
